<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="galv-rim" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e2e8f0"/>
      <stop offset="60%" stop-color="#94a3b8"/>
      <stop offset="85%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>
    <radialGradient id="galv-dish" cx="48%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="85%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>
    <radialGradient id="hole-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="galv-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Shadow & Galvanised Rim Outer Lip -->
  <circle cx="200" cy="200" r="185" fill="#1e293b" filter="url(#galv-shadow)"/>
  <circle cx="200" cy="200" r="180" fill="url(#galv-rim)" stroke="#475569" stroke-width="2.5"/>
  <circle cx="200" cy="200" r="165" fill="#334155" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="158" fill="url(#galv-dish)"/>

  <!-- Valve Stem -->
  <rect x="200" y="38" width="6" height="12" rx="3" fill="#0f172a" stroke="#fff" stroke-width="0.5"/>

  <!-- Stamped Modular Stiffener Ring -->
  <circle cx="200" cy="200" r="128" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 4"/>

  <!-- 8 Circular Stamped Ventilation Holes -->
  <g transform="translate(200, 200)">
    <g id="galv-hole">
      <!-- Stamped Bevel -->
      <circle cx="0" cy="-96" r="23" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
      <!-- Hole interior -->
      <circle cx="0" cy="-96" r="19" fill="url(#hole-shadow)"/>
      <path d="M-13,-108 A 18 18 0 0 1 13 -108" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.8"/>
    </g>
    <use href="#galv-hole" transform="rotate(45)"/>
    <use href="#galv-hole" transform="rotate(90)"/>
    <use href="#galv-hole" transform="rotate(135)"/>
    <use href="#galv-hole" transform="rotate(180)"/>
    <use href="#galv-hole" transform="rotate(225)"/>
    <use href="#galv-hole" transform="rotate(270)"/>
    <use href="#galv-hole" transform="rotate(315)"/>

    <!-- Center Stamped Mounting Dish -->
    <circle cx="0" cy="0" r="58" fill="url(#galv-rim)" stroke="#334155" stroke-width="2"/>
    <circle cx="0" cy="0" r="48" fill="#475569" stroke="#94a3b8" stroke-width="1"/>

    <!-- 5 Heavy Chrome Lug Nuts (5/114.3 pattern) -->
    <circle cx="0" cy="-33" r="5" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <circle cx="31.4" cy="-10.2" r="5" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <circle cx="19.4" cy="26.7" r="5" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <circle cx="-19.4" cy="26.7" r="5" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <circle cx="-31.4" cy="-10.2" r="5" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>

    <!-- Galvanised Center Cap -->
    <circle cx="0" cy="0" r="22" fill="url(#galv-rim)" stroke="#1e293b" stroke-width="2"/>
    <circle cx="0" cy="0" r="16" fill="#334155"/>
    <path d="M-9,-4 L-4,6 L0,-2 L4,6 L9,-4" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>

