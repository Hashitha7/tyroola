<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="silver-lip" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#cfd6df"/>
      <stop offset="85%" stop-color="#ffffff"/>
      <stop offset="93%" stop-color="#8a95a5"/>
      <stop offset="100%" stop-color="#4a5568"/>
    </radialGradient>
    <radialGradient id="silver-barrel" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="60%" stop-color="#94a3b8"/>
      <stop offset="90%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="spoke-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="rim-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Shadow & Tyre bead -->
  <circle cx="200" cy="200" r="185" fill="#1e2430" filter="url(#rim-shadow)"/>
  <circle cx="200" cy="200" r="180" fill="url(#silver-lip)" stroke="#2d3748" stroke-width="2"/>
  <circle cx="200" cy="200" r="162" fill="#0b0f19" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="158" fill="url(#silver-barrel)"/>

  <!-- 8 Split Spokes (16 blades) -->
  <g transform="translate(200, 200)">
    <!-- Spoke Pairs -->
    <g id="split-spoke">
      <path d="M-14,-60 L-22,-148 L-8,-150 L-3,-60 Z" fill="url(#spoke-grad)"/>
      <path d="M14,-60 L22,-148 L8,-150 L3,-60 Z" fill="url(#spoke-grad)"/>
      <!-- Inner cutout highlight -->
      <polygon points="-7,-142 0,-146 7,-142 2,-70 -2,-70" fill="#0f172a"/>
      <!-- Chrome Bevel -->
      <line x1="-22" y1="-148" x2="-8" y2="-150" stroke="#fff" stroke-width="2"/>
      <line x1="8" y1="-150" x2="22" y2="-148" stroke="#fff" stroke-width="2"/>
    </g>
    <use href="#split-spoke" transform="rotate(45)"/>
    <use href="#split-spoke" transform="rotate(90)"/>
    <use href="#split-spoke" transform="rotate(135)"/>
    <use href="#split-spoke" transform="rotate(180)"/>
    <use href="#split-spoke" transform="rotate(225)"/>
    <use href="#split-spoke" transform="rotate(270)"/>
    <use href="#split-spoke" transform="rotate(315)"/>

    <!-- Outer Rim Rivets / Bead Accents -->
    <circle cx="0" cy="-166" r="3" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
    <circle cx="117" cy="-117" r="3" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
    <circle cx="166" cy="0" r="3" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
    <circle cx="117" cy="117" r="3" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
    <circle cx="0" cy="166" r="3" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
    <circle cx="-117" cy="117" r="3" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
    <circle cx="-166" cy="0" r="3" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
    <circle cx="-117" cy="-117" r="3" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>

    <!-- Center Hub Mount Plate -->
    <circle cx="0" cy="0" r="58" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <circle cx="0" cy="0" r="52" fill="url(#silver-lip)"/>

    <!-- 6 Chrome Lug Nuts -->
    <circle cx="0" cy="-35" r="5.5" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <circle cx="30.3" cy="-17.5" r="5.5" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <circle cx="30.3" cy="17.5" r="5.5" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <circle cx="0" cy="35" r="5.5" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <circle cx="-30.3" cy="17.5" r="5.5" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <circle cx="-30.3" cy="-17.5" r="5.5" fill="#f8fafc" stroke="#334155" stroke-width="2"/>

    <!-- Center Cap (Mamba) -->
    <circle cx="0" cy="0" r="24" fill="#0f172a" stroke="#cbd5e1" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="20" fill="#1e293b"/>
    <!-- Mamba Symbol -->
    <path d="M-10,-4 L-5,-10 L0,-4 L5,-10 L10,-4 L8,8 L-8,8 Z" fill="#e2e8f0"/>
    <text x="0" y="5" font-family="'Orbitron', sans-serif" font-size="7" font-weight="900" fill="#000" text-anchor="middle">M</text>
  </g>
</svg>

