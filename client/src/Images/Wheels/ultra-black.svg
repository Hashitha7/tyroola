<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="black-barrel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2e39"/>
      <stop offset="60%" stop-color="#14171f"/>
      <stop offset="90%" stop-color="#0a0b0e"/>
      <stop offset="100%" stop-color="#020304"/>
    </radialGradient>
    <radialGradient id="machined-edge" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#14171f"/>
      <stop offset="92%" stop-color="#cbd5e1"/>
      <stop offset="96%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#1e222d"/>
    </radialGradient>
    <linearGradient id="spoke-satin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b4252"/>
      <stop offset="40%" stop-color="#1e222d"/>
      <stop offset="100%" stop-color="#0d0f14"/>
    </linearGradient>
    <filter id="shadow-deep" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Deep Shadow & Outer Lip -->
  <circle cx="200" cy="200" r="185" fill="#000" filter="url(#shadow-deep)"/>
  <circle cx="200" cy="200" r="180" fill="#181b24" stroke="#333948" stroke-width="2"/>
  <circle cx="200" cy="200" r="168" fill="url(#machined-edge)"/>
  <circle cx="200" cy="200" r="162" fill="url(#black-barrel)"/>

  <!-- 10 Spoke Ultra 226 Design with Machined Cutouts -->
  <g transform="translate(200, 200)">
    <g id="ultra-spoke">
      <!-- Outer Machined Silver Pocket Accent -->
      <polygon points="-18,-55 -28,-148 28,-148 18,-55" fill="#cbd5e1"/>
      <!-- Inner Satin Black Pocket -->
      <polygon points="-15,-58 -24,-145 24,-145 15,-58" fill="url(#spoke-satin)"/>
      <!-- Center Milling Groove -->
      <line x1="0" y1="-70" x2="0" y2="-138" stroke="#4a5568" stroke-width="2.5"/>
      <line x1="-1" y1="-70" x2="-1" y2="-138" stroke="#cbd5e1" stroke-width="1"/>
    </g>
    <use href="#ultra-spoke" transform="rotate(36)"/>
    <use href="#ultra-spoke" transform="rotate(72)"/>
    <use href="#ultra-spoke" transform="rotate(108)"/>
    <use href="#ultra-spoke" transform="rotate(144)"/>
    <use href="#ultra-spoke" transform="rotate(180)"/>
    <use href="#ultra-spoke" transform="rotate(216)"/>
    <use href="#ultra-spoke" transform="rotate(252)"/>
    <use href="#ultra-spoke" transform="rotate(288)"/>
    <use href="#ultra-spoke" transform="rotate(324)"/>

    <!-- Inner Stepped Lip -->
    <circle cx="0" cy="0" r="62" fill="#0b0d12" stroke="#475569" stroke-width="1.5"/>

    <!-- Lug Nut Ring (6 Lugs) -->
    <circle cx="0" cy="-38" r="6" fill="#111" stroke="#cbd5e1" stroke-width="1.8"/>
    <circle cx="32.9" cy="-19" r="6" fill="#111" stroke="#cbd5e1" stroke-width="1.8"/>
    <circle cx="32.9" cy="19" r="6" fill="#111" stroke="#cbd5e1" stroke-width="1.8"/>
    <circle cx="0" cy="38" r="6" fill="#111" stroke="#cbd5e1" stroke-width="1.8"/>
    <circle cx="-32.9" cy="19" r="6" fill="#111" stroke="#cbd5e1" stroke-width="1.8"/>
    <circle cx="-32.9" cy="-19" r="6" fill="#111" stroke="#cbd5e1" stroke-width="1.8"/>

    <!-- Hex Nut Detail -->
    <polygon points="0,-41 3,-39 3,-36 0,-34 -3,-36 -3,-39" fill="#94a3b8"/>
    <polygon points="32.9,-22 35.9,-20 35.9,-17 32.9,-15 29.9,-17 29.9,-20" fill="#94a3b8"/>
    <polygon points="32.9,16 35.9,18 35.9,21 32.9,23 29.9,21 29.9,18" fill="#94a3b8"/>
    <polygon points="0,35 3,37 3,40 0,42 -3,40 -3,37" fill="#94a3b8"/>
    <polygon points="-32.9,16 -29.9,18 -29.9,21 -32.9,23 -35.9,21 -35.9,18" fill="#94a3b8"/>
    <polygon points="-32.9,-22 -29.9,-20 -29.9,-17 -32.9,-15 -35.9,-17 -35.9,-20" fill="#94a3b8"/>

    <!-- Center Hub Cap (Ultra) -->
    <circle cx="0" cy="0" r="26" fill="#141720" stroke="#ff4757" stroke-width="2"/>
    <circle cx="0" cy="0" r="21" fill="#0a0c10"/>
    <text x="0" y="4" font-family="'Orbitron', sans-serif" font-size="8" font-weight="900" fill="#ff4757" text-anchor="middle" letter-spacing="1">ULTRA</text>
  </g>
</svg>

