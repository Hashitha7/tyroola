<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="100%" height="100%">
  <defs>
    <linearGradient id="car-front-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="60%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="windshield-tint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="repair-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- ── 1. Front View of Modern Dark Grey Car ── -->
  <g transform="translate(480, 240)">
    <!-- Car Shadow -->
    <ellipse cx="0" cy="115" rx="160" ry="24" fill="#000000" opacity="0.6"/>

    <!-- Left & Right Front Tyres -->
    <rect x="-145" y="30" width="36" height="85" rx="8" fill="#111827" stroke="#374151" stroke-width="3"/>
    <rect x="109" y="30" width="36" height="85" rx="8" fill="#111827" stroke="#374151" stroke-width="3"/>

    <!-- Roof & Windshield -->
    <path d="M-90,-115 L90,-115 L125,-35 L-125,-35 Z" fill="#1f2937"/>
    <path d="M-82,-110 L82,-110 L115,-40 L-115,-40 Z" fill="url(#windshield-tint)"/>
    <!-- Rearview Mirrors -->
    <rect x="-142" y="-45" width="22" height="12" rx="4" fill="#1f2937"/>
    <rect x="120" y="-45" width="22" height="12" rx="4" fill="#1f2937"/>

    <!-- Car Hood / Main Bumper -->
    <path d="M-135,-35 L135,-35 C150,-35 155,-20 155,10 L155,75 C155,95 140,105 120,105 L-120,105 C-140,105 -155,95 -155,75 L-155,10 C-155,-20 -150,-35 -135,-35 Z" fill="url(#car-front-body)" stroke="#4b5563" stroke-width="2"/>

    <!-- Grille -->
    <path d="M-95,15 L95,15 L80,65 L-80,65 Z" fill="#0f1118" stroke="#374151" stroke-width="2"/>
    <line x1="-88" y1="28" x2="88" y2="28" stroke="#374151" stroke-width="2"/>
    <line x1="-82" y1="42" x2="82" y2="42" stroke="#374151" stroke-width="2"/>
    <line x1="-76" y1="56" x2="76" y2="56" stroke="#374151" stroke-width="2"/>

    <!-- License Plate (Tyroola Style) -->
    <rect x="-38" y="70" width="76" height="24" rx="4" fill="#374151" stroke="#9ca3af" stroke-width="1.5"/>
    <rect x="-34" y="74" width="68" height="16" rx="2" fill="#e5e7eb"/>

    <!-- Sleek Xenon Headlights -->
    <path d="M-145,-15 L-95,5 L-95,25 L-145,0 Z" fill="#f8fafc" stroke="#60a5fa" stroke-width="1.5" opacity="0.95"/>
    <path d="M145,-15 L95,5 L95,25 L145,0 Z" fill="#f8fafc" stroke="#60a5fa" stroke-width="1.5" opacity="0.95"/>
    <!-- LED Light Bar Accents -->
    <path d="M-140,-12 L-100,4" stroke="#ffc700" stroke-width="3" stroke-linecap="round"/>
    <path d="M140,-12 L100,4" stroke="#ffc700" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ── 2. Mechanic Under the Car (On Yellow Creeper) ── -->
  <g transform="translate(370, 310)">
    <!-- Yellow Mechanic Creeper Bed -->
    <rect x="-70" y="30" width="130" height="16" rx="8" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
    <circle cx="-55" cy="46" r="5" fill="#111827"/>
    <circle cx="0" cy="46" r="5" fill="#111827"/>
    <circle cx="45" cy="46" r="5" fill="#111827"/>

    <!-- Mechanic Body lying down on back with legs protruding out -->
    <!-- Legs in dark work pants -->
    <path d="M-105,32 L-20,32 L-20,15 L-105,15 Z" fill="#1f2937"/>
    <!-- Boots -->
    <rect x="-120" y="10" width="22" height="28" rx="4" fill="#111827"/>
    <!-- Torso in dark blue/grey overalls -->
    <rect x="-20" y="15" width="65" height="24" rx="6" fill="#374151"/>
    <!-- Arms reaching up under car with wrench -->
    <path d="M25,20 L40,-35 L55,-35" stroke="#fed7aa" stroke-width="8" stroke-linecap="round"/>
    <path d="M50,-35 L68,-45" stroke="#9ca3af" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- ── 3. Mechanic Kneeling on Right by the Wheel ── -->
  <g transform="translate(630, 240)">
    <!-- Head & Cap -->
    <circle cx="0" cy="0" r="16" fill="#fed7aa"/>
    <path d="M-14,-2 C-14,-15 14,-15 14,-2 L18,-2" fill="#1f2937"/>
    <circle cx="-4" cy="0" r="2" fill="#000"/>

    <!-- Torso (Black T-shirt with yellow work vest accents) -->
    <path d="M-15,16 L15,16 L18,75 L-18,75 Z" fill="#111827"/>
    <rect x="-18" y="45" width="36" height="8" fill="#f59e0b"/>

    <!-- Arms checking the tyre -->
    <path d="M-12,20 L-35,50 L-50,45" stroke="#fed7aa" stroke-width="9" stroke-linecap="round"/>
    
    <!-- Kneeling Legs & Work Pants -->
    <path d="M-15,75 L-25,125 L10,125 L5,95 L18,125 L35,125 L25,75 Z" fill="#1f2937"/>
    <rect x="-35" y="125" width="26" height="12" rx="4" fill="#111827"/>
    <rect x="25" y="125" width="26" height="12" rx="4" fill="#111827"/>
  </g>

  <!-- ── 4. Central Glowing Smartphone with Yellow Wrench ── -->
  <g transform="translate(230, 220)">
    <!-- Yellow Ambient Glow Ring -->
    <circle cx="0" cy="0" r="135" fill="none" stroke="#ffc700" stroke-width="4.5" opacity="0.95"/>
    <circle cx="0" cy="0" r="125" fill="#ffc700" opacity="0.12"/>

    <!-- Phone Body -->
    <rect x="-52" y="-100" width="104" height="200" rx="18" fill="#1f242d" stroke="#4b5563" stroke-width="3.5" filter="url(#repair-shadow)"/>
    <!-- Phone Screen -->
    <rect x="-44" y="-84" width="88" height="158" rx="8" fill="#0f1118"/>
    <!-- Speaker Bar -->
    <rect x="-12" y="-92" width="24" height="3" rx="1.5" fill="#6b7280"/>

    <!-- Large Bold Yellow Wrench Icon on Screen -->
    <g transform="translate(0, -6)" filter="url(#repair-shadow)">
      <path d="M-22,-28 C-30,-20 -30,-8 -22,0 L18,40 C22,44 28,44 32,40 C36,36 36,30 32,26 L-8,-14 C0,-22 -12,-34 -22,-28 Z" fill="#ffc700"/>
      <!-- Wrench Cutout Head -->
      <path d="M-12,-32 L-4,-24 L-12,-16 L-20,-24 Z" fill="#0f1118"/>
    </g>

    <!-- Hands Holding & Tapping the Phone -->
    <!-- Left Hand -->
    <path d="M-80,25 C-70,5 -55,-5 -50,-15 L-48,15 C-48,50 -60,65 -75,75 Z" fill="#fed7aa"/>
    <path d="M-80,25 L-125,75" stroke="#f59e0b" stroke-width="25" stroke-linecap="round"/>

    <!-- Right Hand with Finger Touching Screen -->
    <path d="M10,40 L12,8 C12,-6 28,-6 28,8 L26,55" fill="#fed7aa"/>
    <path d="M26,55 C36,55 50,65 60,85 L105,130" stroke="#f59e0b" stroke-width="26" stroke-linecap="round"/>
    <circle cx="20" cy="0" r="7" fill="#fed7aa"/>
  </g>
</svg>
